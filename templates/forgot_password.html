<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Amination Esports</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="logo">
        AMINATION <span>ESPORTS</span>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/tournament">Tournament</a>
        <a href="/live">Live</a>
        <a href="/standings">Standings</a>
        <a href="/players">Players</a>
        <a href="/matches">Matches</a>
        <a href="/terms">Rules</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </nav>
</header>

<main>

<section class="register-section">

    <h1>RESET PASSWORD</h1>

    <p>
        Enter the email address connected to your player account.
    </p>

    <form method="POST"
          action="{{ url_for('forgot_password') }}">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
        >

        <button type="submit">
            REQUEST PASSWORD RESET
        </button>

    </form>

    <p class="form-help">
        Remember your password?
        <a href="{{ url_for('player_login') }}">Return to login</a>.
    </p>

</section>

</main>

<footer>
    <p>
        © 2026 Amination Esports —
        From Imagination to Reality.
    </p>
</footer>

</body>
</html>
