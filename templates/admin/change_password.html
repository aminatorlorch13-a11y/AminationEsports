<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Founder Password | Amination Esports</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
<main class="container">
    <section class="card">

        <h1>Change Founder Password</h1>

        <p>
            Update your Amination Esports founder password.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form
            method="POST"
            action="{{ url_for('founder_change_password') }}"
        >

            <div>
                <label for="current_password">
                    Current Password
                </label>

                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div>
                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    autocomplete="new-password"
                    minlength="12"
                    required
                >
            </div>

            <div>
                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    autocomplete="new-password"
                    minlength="12"
                    required
                >
            </div>

            <button type="submit">
                Change Password
            </button>

        </form>

        <p>
            <a href="{{ url_for('admin_dashboard') }}">
                Return to Founder Dashboard
            </a>
        </p>

    </section>
</main>
</body>
</html>
